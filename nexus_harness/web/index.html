<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="nexus-token" content="{{token}}">
<title>Nexus Harness</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--NEXUS_SPRITE-->

<!-- El chat, y solo el chat: ancho de lado a lado. La configuracion vive en su propia pantalla
     (`/settings`), que se abre con el boton de la barra lateral. -->
<header class="topbar chat-top">
  <div class="brand">NEXUS<span>·</span>HARNESS</div>
  <!-- La barra en vivo: fase activa, herramienta en curso y progreso. Al pulsar, el ultimo turno y el
       control del Autopilot. La pinta `activity.js` desde `/api/activity`. -->
  <div class="top-right">
    <button id="activity" class="activity idle" type="button" aria-expanded="false"
            aria-controls="activity-pop" title="Estado del motor en vivo">
      <span id="activity-glyph" class="aglyph" aria-hidden="true">🟢</span>
      <span id="activity-label" class="alabel">conectando…</span>
      <span id="activity-bar" class="abar" hidden aria-hidden="true"><i></i></span>
    </button>
    <div id="activity-pop" class="popover" role="dialog" aria-label="Último turno y Autopilot" hidden>
      <header class="pophead">
        <strong>Último turno</strong>
        <span id="pop-when" class="dim"></span>
      </header>
      <p id="pop-summary" class="dim">todavía sin turnos en este proyecto</p>
      <div id="pop-files" class="chips"></div>
      <div id="pop-gate" class="poprows"></div>
      <footer class="popfoot">
        <label class="quick">Iteraciones
          <input id="auto-iterations" type="number" value="3" min="1" max="50"
                 title="cuántos ciclos hace el bucle antes de parar">
        </label>
        <button id="auto-start" class="primary"
                title="Backup, planifica, ejecuta, verifica y avanza hasta terminar o agotar ciclos">
          🚀 Modo Autónomo Iterativo</button>
        <button id="auto-stop" class="ghost" hidden>Detener bucle</button>
      </footer>
      <p id="pop-note" class="dim popnote"></p>
    </div>
  </div>
</header>

<div id="warn" class="warn" hidden></div>

<div class="app chat-only">
  <aside class="sidebar">
    <label class="field">Proyecto<select id="project"></select></label>
    <button id="new-chat" class="primary wide">Nueva conversación</button>
    <div class="side-title">Conversaciones</div>
    <input id="session-search" class="search" type="search" placeholder="buscar conversación…">
    <ul id="sessions" class="sessions"></ul>
    <div class="spacer"></div>
    <a id="settings" class="settings-btn" href="/settings?token={{token}}">⚙ Configuración</a>
    <div id="engine" class="foot"></div>
  </aside>

  <main class="main">
    <header class="topbar-inner">
      <div id="title" class="title">sin conversación</div>
    </header>

    <section id="thread" class="thread" aria-live="polite"></section>

    <section class="composer">
      <div id="pending" class="pending"></div>
      <div class="composer-box">
        <textarea id="input" rows="3"
          placeholder="Elige un proyecto en la barra lateral para empezar"></textarea>
        <div class="composer-tools">
          <button id="attach" class="ghost" title="Adjuntar imagen o documento">+ Adjuntar</button>
          <button id="send" class="primary">Enviar</button>
          <button id="stop" class="ghost" disabled>Detener</button>
        </div>
      </div>
      <div class="composer-foot">
        <label class="quick">Director
          <select id="quick-director" title="Modelo del Director para los próximos turnos"></select>
        </label>
        <span class="dim hint-inline">Ctrl+Enter envía · pega una imagen o arrastra un fichero</span>
      </div>
      <input id="file" type="file" multiple hidden
        accept=".png,.jpg,.jpeg,.webp,.gif,.txt,.md,.json,.py,.pdf">
    </section>
  </main>
</div>

<script src="token.js"></script>
<script src="app.js"></script>
<script src="panels.js"></script>
<script src="activity.js"></script>
</body>
</html>
