<!doctype html>
<html lang="es" data-mode="{{mode}}" data-accent="{{accent}}" data-skin="{{skin}}" data-font="{{font}}" data-density="{{density}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<!-- Favicon SVG inline: sin peticion extra y sin red. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23121110'/%3E%3Cpath d='M12 4l7 4v8l-7 4-7-4V8z' fill='none' stroke='%23d4502e' stroke-width='1.6'/%3E%3C/svg%3E">
<meta name="nexus-token" content="{{token}}">
<title>Nexus Harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="skins.css">
<link rel="stylesheet" href="skins-special.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="density.css">
</head>
<body class="chat-only">
<a class="skip" href="#thread">Saltar al hilo</a>
<!--NEXUS_SPRITE-->

<!-- El cuaderno de obra: masthead de una línea, índice a la izquierda y el hilo como documento.
     Configuración es la unica puerta de la cabina: dentro viven las secciones (modelos, memoria,
     autonomía, tablero) y el enlace a la gobernanza del protocolo.
     La línea de estado la pinta `activity.js` desde `/api/activity`. -->
<header class="masthead chat-top">
  <a class="brand" href="/?token={{token}}">NEXUS<span>·</span>HARNESS</a>
  <div class="top-right">
    <a id="settings" class="navlink top-link" href="/settings?token={{token}}"
       title="Modelos, claves, memoria, skills, autonomía, tablero y el resto del manual">Configuración</a>
  </div>
</header>

<div id="warn" class="warn" role="status" aria-live="polite" hidden></div>

<div class="app">
  <aside class="sidebar">
    <div class="volume"><span class="label">Proyecto</span><select id="project"
      aria-label="Proyecto"></select></div>
    <button id="new-chat" class="wide">+ Nueva conversación</button>
    <nav class="side-switch" role="tablist" aria-label="Vista de la columna">
      <button type="button" role="tab" data-view="threads" class="on" aria-selected="true">Hilos</button>
      <button type="button" role="tab" data-view="projects" aria-selected="false">Proyectos</button>
    </nav>
    <input id="session-search" class="search" type="search" placeholder="buscar folio…"
           aria-label="Buscar conversación">
    <ul id="sessions" class="sessions" role="listbox" aria-label="Conversaciones"></ul>
    <ul id="projects-list" class="sessions projects-list" role="listbox"
        aria-label="Proyectos del workspace" hidden></ul>
    <div class="spacer"></div>
  </aside>

  <main class="main">
    <header class="doc-head">
      <h1 id="title" class="title">sin conversación</h1>
      <button id="export-thread" class="doc-act" type="button"
              title="Descargar este hilo en Markdown">Exportar</button>
      <span id="doc-meta" class="meta"></span>
    </header>

    <section id="thread" class="thread" aria-live="polite" tabindex="-1"></section>

    <section class="composer">
      <div id="pending" class="pending"></div>
      <div class="composer-box">
        <textarea id="input" rows="2" aria-label="Mensaje"
          placeholder="Elige un proyecto en el índice para empezar"></textarea>
        <div class="composer-tools">
          <button id="attach" type="button" title="Adjuntar imagen o documento">Adjuntar</button>
          <span class="grow"></span>
          <button id="stop" type="button" disabled>Detener</button>
          <button id="send" class="primary" type="button">Enviar ⏎</button>
        </div>
      </div>
      <input id="file" type="file" multiple hidden
        accept=".png,.jpg,.jpeg,.webp,.gif,.txt,.md,.json,.py,.pdf">
    </section>
  </main>
</div>

<script src="token.js"></script>
<script src="app.js"></script>
<script src="chat_stream.js"></script>
<script src="export.js"></script>
<script src="sessions.js"></script>
<script src="composer.js"></script>
<script src="activity.js"></script>
</body>
</html>
