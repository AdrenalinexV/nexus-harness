<!doctype html>
<html lang="es" data-theme="{{theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="nexus-token" content="{{token}}">
<title>Nexus Harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="chat-only">
<!--NEXUS_SPRITE-->

<!-- El cuaderno de obra: masthead de una línea, índice a la izquierda y el hilo como documento.
     La configuración (`/settings`) y la gobernanza (`/gov`) son las dos puertas del índice.
     La línea de estado la pinta `activity.js` desde `/api/activity`. -->
<header class="masthead chat-top">
  <a class="brand" href="/?token={{token}}">NEXUS<span>·</span>HARNESS</a>
  <span class="meta">motor <b id="engine"></b> · v<span id="version"></span></span>
  <div class="top-right">
    <button id="activity" class="activity idle" type="button" aria-expanded="false"
            aria-controls="activity-pop" title="Estado del motor en vivo">
      <span id="activity-glyph" class="aglyph" aria-hidden="true"></span>
      <span id="activity-label" class="alabel">conectando…</span>
      <span id="activity-bar" class="abar" hidden aria-hidden="true"><i></i></span>
    </button>
    <div id="activity-pop" class="popover" role="dialog" aria-label="Último turno y Autopilot" hidden>
      <header class="pophead">
        <strong>Último turno</strong>
        <span id="pop-when" class="dim mono"></span>
      </header>
      <p id="pop-summary" class="dim">todavía sin turnos en este proyecto</p>
      <div id="pop-files" class="chips"></div>
      <div id="pop-gate" class="poprows"></div>
      <!-- La ley del color, donde se lee un veredicto: cuatro estados, un significado cada uno. -->
      <p class="legend" aria-label="Leyenda de veredictos">
        <span class="t-ok"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg>decisión tomada</span>
        <span class="t-warn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-alert"/></svg>espera a una persona / no verificable</span>
        <span class="t-bad"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-xcircle"/></svg>detectado</span>
        <span class="t-idle"><span class="dot"></span>sin registro</span>
      </p>
      <footer class="popfoot">
        <label class="quick">Iteraciones
          <input id="auto-iterations" type="number" value="3" min="1" max="50"
                 title="cuántos ciclos hace el bucle antes de parar">
        </label>
        <button id="auto-start" class="primary"
                title="Backup, planifica, ejecuta, verifica y avanza hasta terminar o agotar ciclos">
          Modo Autónomo Iterativo</button>
        <button id="auto-stop" class="ghost" hidden>Detener bucle</button>
      </footer>
      <p id="pop-note" class="dim popnote"></p>
    </div>
  </div>
</header>

<div id="warn" class="warn" hidden></div>

<div class="app">
  <aside class="sidebar">
    <div class="volume"><span class="label">Proyecto</span><select id="project"
      aria-label="Proyecto"></select></div>
    <button id="new-chat" class="wide">+ Nueva conversación</button>
    <div class="side-title">Índice</div>
    <input id="session-search" class="search" type="search" placeholder="buscar folio…"
           aria-label="Buscar conversación">
    <ul id="sessions" class="sessions"></ul>
    <div class="spacer"></div>
    <div class="side-title">Puertas</div>
    <a id="settings" class="navlink" href="/settings?token={{token}}">
      <span class="sigil" aria-hidden="true">§</span>Configuración</a>
    <a id="gov" class="navlink" href="/gov?token={{token}}">
      <span class="sigil" aria-hidden="true">◇</span>Gobernanza</a>
    <div class="foot mono"><span id="engine-root"></span></div>
  </aside>

  <main class="main">
    <header class="doc-head">
      <h1 id="title" class="title">sin conversación</h1>
      <span id="doc-meta" class="meta"></span>
    </header>

    <section id="thread" class="thread" aria-live="polite"></section>

    <section class="composer">
      <div id="pending" class="pending"></div>
      <div class="composer-box">
        <textarea id="input" rows="2" aria-label="Mensaje"
          placeholder="Elige un proyecto en el índice para empezar"></textarea>
        <div class="composer-tools">
          <button id="attach" type="button" title="Adjuntar imagen o documento">Adjuntar</button>
          <span class="grow"></span>
          <button id="stop" type="button" disabled>Detener</button>
          <button id="send" class="primary" type="button">Enviar ⏎</button>
        </div>
      </div>
      <div class="composer-foot">
        <label class="quick">Director
          <select id="quick-director" title="Modelo del Director para los próximos turnos"></select>
        </label>
        <span>Ctrl+Enter envía · arrastra un fichero</span>
      </div>
      <input id="file" type="file" multiple hidden
        accept=".png,.jpg,.jpeg,.webp,.gif,.txt,.md,.json,.py,.pdf">
    </section>
  </main>
</div>

<script src="token.js"></script>
<script src="app.js"></script>
<script src="chat_stream.js"></script>
<script src="sessions.js"></script>
<script src="composer.js"></script>
<script src="activity.js"></script>
</body>
</html>
