name: verify

# The repo's own gate, run where it has never run before: a machine that is not the one it was
# written on. Three questions, three jobs:
#   verify  -- does the law hold and do all 62 suites pass on Windows and Linux, 3.11 and 3.13?
#   wheel   -- does `pip install .` ship something that actually runs (the cockpit's assets included)?
#   extras  -- with the OPTIONAL engines installed, do the suites that SKIP turn into real coverage?
# A skip is printed, counted and allowed; a failure never is.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      # Historial completo: la suite `doc_truth` comprueba que cada documento «congelado» nombra un
      # commit que existe. Con fetch-depth 1 ese check no puede responder, y una comprobación que no
      # puede correr no es una comprobación.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint (line law) + every deterministic suite
        env:
          # Bytecode cacheado hace que un fichero arreglado parezca roto: prefijo fresco por combinacion.
          # (En el `env:` del job el contexto `runner` no existe; aqui si.)
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache-${{ matrix.python }}
        run: python tools/verify.py

  wheel:
    name: wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package as a user would
        run: python -m pip install .
      - name: The cockpit's assets must travel inside the wheel
        shell: bash
        run: |
          python -c "import pathlib,sys,nexus_harness as n; web=pathlib.Path(n.__file__).parent/'web'; print('package:', pathlib.Path(n.__file__).parent); print('assets:', sorted(p.name for p in web.iterdir()) if web.is_dir() else 'MISSING'); sys.exit(0 if (web/'index.html').is_file() else 'the wheel shipped without web/index.html: pip install . gives a dead cockpit')"
      - name: Run the shipped entry point from outside the repository
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          nexus-harness --version
          nexus-harness selftest

  docs:
    name: docs / las cifras publicadas cuadran
    runs-on: ubuntu-latest
    steps:
      # Historial completo: `doc_truth` exige que el sha de cada documento congelado exista de verdad.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # El job que impide que un número viejo sobreviva a la sesión que lo iba a desmentir. La suite
      # `doc_truth` ya corre dentro de `verify`; este job existe para que el rojo se llame por su nombre.
      - name: Ningun documento puede contradecir al motor
        run: python tools/doc_truth.py

  extras:
    name: extras / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the optional engines the suites declare as SKIP
        run: |
          python -m pip install ".[media,browser]"
          python -m playwright install --with-deps chromium
      - name: With the engines present, SKIP must become coverage
        run: |
          # `python ... | tee` sin pipefail devuelve el exit de `tee`: un selftest rojo pasaba por
          # verde si el resumen traia la palabra buscada. El exit del motor va primero.
          set -o pipefail
          python -m nexus_harness selftest 2>&1 | tee /tmp/selftest.log
          # Aqui SI hay Pillow y Playwright, asi que esas dos suites no pueden quedarse en SKIP. Las
          # que dependen del gobernador (bridge, session_relay) si se saltan: no esta en CI.
          if grep -qE "^(browser|attachments|nightshift)[[:space:]]+SKIP" /tmp/selftest.log; then
            echo "::error::con los motores instalados, browser/attachments/nightshift no deben saltarse"
            exit 1
          fi
